<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Elfan AI Academy</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <style>
            body { 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                text-align: center; 
                margin: 0;
                padding: 20px;
                color: #333;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
                background-color: #000;
            }
            
            /* YouTube Background Video Styling (Optimized with Scale-Up Cropping to Hide Native UI) */
            .bg-video {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                z-index: -2;
            }
            .bg-video iframe {
                position: absolute;
                top: 50%;
                left: 50%;
                /* Scaled up significantly to push native YouTube watermarks, titles, and top bars outside the viewport view */
                width: 130vw;
                height: 231.11vw;
                min-height: 140vh;
                min-width: 78.75vh;
                transform: translate(-50%, -50%);
                pointer-events: none;
            }

            .video-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.45);
                z-index: -1;
            }

            .container {
                max-width: 420px;
                width: 90%;
                background: rgba(255, 255, 255, 0.96);
                padding: 55px 20px 35px 20px;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.3);
                box-sizing: border-box;
                position: relative;
                margin-top: 40px;
                z-index: 1;
            }
            
            /* Circular Profile Picture */
            .profile-container {
                position: absolute;
                top: -45px;
                left: 50%;
                transform: translateX(-50%);
                width: 90px;
                height: 90px;
                border-radius: 50%;
                overflow: hidden;
                border: 4px solid white;
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
                background: white;
            }
            .profile-container img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            h1 { 
                color: #2c3e50; 
                margin-bottom: 8px; 
                font-size: 1.5rem; 
            }
            p { 
                color: #555; 
                font-size: 0.95rem; 
                line-height: 1.5;
                margin-bottom: 25px; 
            }
            p b {
                color: #d9534f;
            }
            
            /* Big WhatsApp Button Styling */
            .btn-whatsapp-big {
                display: block;
                width: 100%;
                padding: 18px 15px;
                border-radius: 12px;
                text-align: center;
                text-decoration: none;
                font-weight: 800;
                font-size: 1.15rem;
                box-sizing: border-box;
                background-color: #25D366;
                color: white;
                box-shadow: 0 6px 18px rgba(37, 211, 102, 0.4);
                transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            }
            .btn-whatsapp-big:hover {
                transform: translateY(-3px) scale(1.02);
                box-shadow: 0 10px 22px rgba(37, 211, 102, 0.6);
                opacity: 0.95;
            }
        </style>
    </head>
    <body>
        <!-- YouTube Background Embed with Overflow Scale-Up to Crop Out Native UI/Watermarks -->
        <div class="bg-video">
            <iframe src="https://www.youtube.com/embed/fg6JCIs9_g4?autoplay=1&mute=1&loop=1&playlist=fg6JCIs9_g4&controls=0&disablekb=1&modestbranding=1&playsinline=1&iv_load_policy=3" 
                    title="YouTube background video" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
        <div class="video-overlay"></div>

        <div class="container">
            <!-- Profile Image -->
            <div class="profile-container">
                <img src="qqqq.jpeg" alt="Elfan AI Academy Logo">
            </div>

            <h1>Elfan AI Academy</h1>
            <p>
                <b>Daftar Elfan AI Academy</b><br>
                Kuliah S1 + Bootcamp AI 6 Bulan<br>
                <b>Kuota Terbatas!</b>
            </p>
            
            <!-- Big CTA Button with Pre-filled WhatsApp Message -->
            <a class="btn-whatsapp-big" href="https://wa.me/6289528036024?text=Halo%20Admin,%20saya%20tertarik%20dengan%20pendaftaran%20Elfan%20AI%20Academy%20S1%20+%20Bootcamp%206%20Bulan." target="_blank">
                💬 Chat Admin di WhatsApp
            </a>
        </div>
    </body>
</html>
